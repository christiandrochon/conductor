name: Release conductor-mcp

# Triggers on tags of the form mcp-v<semver>, e.g. mcp-v0.1.0.
# The companion release.yml handles v* tags for conductor-e2e.
on:
  push:
    tags:
      - 'mcp-v*'

jobs:
  release-mcp:
    name: Build, GitHub Release, GitHub Packages & npm publish (conductor-mcp)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release + upload asset
      packages: write   # publish to GitHub Packages
      id-token: write   # npm Trusted Publishing (OIDC) + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies (root + workspaces)
        run: npm ci

      # Typecheck is omitted here — see ci.yml for rationale. The MCP SDK's
      # deep generics OOM tsc even at 6 GB heap on hosted runners. esbuild
      # below catches parse / resolution errors; CI's smoke tests on every
      # push to main guarantee runtime correctness before tag time.

      - name: Build (conductor-mcp)
        run: npm run build -w mcp

      # Verify the pushed tag version matches mcp/package.json version.
      # e.g. tag mcp-v0.1.0 must match "version": "0.1.0" in mcp/package.json.
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./mcp/package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/mcp-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag mcp-v$TAG_VERSION does not match mcp/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Pack tarball
        run: npm pack -w mcp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            christiandrochon-conductor-mcp-*.tgz

      - name: Publish to GitHub Packages
        # Run npm publish from inside mcp/ so npm picks up mcp/package.json
        # rather than the root package.json. GITHUB_TOKEN is automatically
        # available in Actions and grants packages:write for this repo.
        working-directory: mcp
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on GitHub Packages, skipping"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Second registry: public npmjs.org, via npm Trusted Publishing (OIDC): no npm token.
      # npm publishes with a short-lived credential minted from this workflow's OIDC identity
      # (permission `id-token: write` above); provenance is generated automatically.
      # Prerequisites (https://docs.npmjs.com/trusted-publishers): npm CLI >= 11.5.1 and
      # Node >= 22.14.0, hence Node 24 and a npm upgrade below. A trusted publisher must be
      # configured on npmjs.com for the package (owner christiandrochon, repo conductor,
      # workflow file release-mcp.yml), and package.json `repository.url` must match the GitHub repository.
      # The explicit --registry flag overrides the publishConfig in package.json, which
      # points at GitHub Packages.
      - name: Set up Node.js (npmjs.org)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Must be explicit: the GitHub Packages setup-node step above wrote
          # `@christiandrochon:registry=https://npm.pkg.github.com/` (scope defaults to
          # the repo owner), and a scoped registry beats `--registry`. Setting
          # the scope here replaces that line so publishes really hit npmjs.org.
          scope: '@christiandrochon'

      - name: Upgrade npm (Trusted Publishing requires >= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Publish to npmjs.org
        working-directory: mcp
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npmjs.org, skipping"
          else
            npm publish --registry https://registry.npmjs.org --access public
          fi
